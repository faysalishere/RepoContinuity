name: Publish GitHub beta release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate matching version and execute regression tests
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          expected = 'v' + tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          actual = os.environ['GITHUB_REF_NAME']
          if actual != expected:
              raise SystemExit(f'Tag mismatch: {actual!r} != {expected!r}')
          PY
          PYTHONPATH=src python -m unittest discover -s tests -q
          python scripts/check_release.py
          PYTHONPATH=src python examples/quickstart_demo.py --yes
      - name: Build release files and checksums
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --sdist --outdir dist
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt)
      - name: Create GitHub pre-release (never overwrite existing tags/releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && { echo 'Release already exists; refusing overwrite'; exit 1; } || true
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "RepoContinuity $GITHUB_REF_NAME — Public Beta" \
            --notes-file RELEASE_NOTES.md \
            --prerelease --verify-tag
