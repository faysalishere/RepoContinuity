name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit, integration and security tests
        shell: bash
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          python -m compileall -q src scripts examples
          python scripts/check_release.py
          PYTHONPATH=src python examples/quickstart_demo.py --yes
  package:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel and install in clean virtual environment
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --sdist --outdir dist
          python -m venv release-test-env
          release-test-env/bin/python -m pip install --no-index --no-deps dist/*.whl
          release-test-env/bin/python -m repocontinuity --version
          release-test-env/bin/python examples/quickstart_demo.py --yes
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Upload beta build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repocontinuity-beta-build
          path: dist/
          if-no-files-found: error
