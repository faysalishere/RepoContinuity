[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repocontinuity"
version = "0.4.0b1"
description = "Local-first, approval-aware, evidence-verified project handoff for AI-assisted development"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Faysal"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.scripts]
repocontinuity = "repocontinuity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
